<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Encore 14.02</title>
<style>
:root {
  --bg: #0a0a12; --panel: #0e1116; --sunk: #11151b; --line: #1e2732;
  --fg: #c8ced8; --bright: #e6ebf2; --dim: #7c8798; --faint: #4d5765;
  --ok: #7fd0a0; --bad: #d08a7f; --warn: #d8c07f;
  --sans: "Segoe UI", system-ui, sans-serif;
  --mono: Consolas, "DejaVu Sans Mono", monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; min-height: 100%; background: var(--bg);
  color: var(--fg); font: 15px/1.45 var(--sans); }
#brand { padding: 8px 10px; border-bottom: 1px solid var(--line);
  background: var(--panel); text-align: center; }
#brand b { color: #00ccff; font-size: 16px; font-weight: 700; letter-spacing: 0.14em; }
#ramBox { overflow: hidden; padding: 5px 10px; border-bottom: 1px solid var(--line);
  background: var(--sunk); color: var(--ok); font: 11px/1.4 var(--mono);
  text-overflow: ellipsis; white-space: nowrap; }
#spin { position: fixed; top: calc(50% + 20px); left: 50%; width: 46px; height: 46px;
  margin: -23px 0 0 -23px; border: 4px solid var(--line); border-top-color: var(--ok);
  border-radius: 50%; animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#msg { position: fixed; top: 50%; left: 0; right: 0; transform: translateY(-50%);
  display: none; text-align: center; font-size: 16px; letter-spacing: 0.5px; }
#state, #out { display: none; }
body.done #spin, body.fail #spin { display: none; }
body.fail #msg { display: block; }
body.done #msg { display: block; color: var(--ok); font-weight: 700; letter-spacing: 2px; }
body.log { display: flex; flex-direction: column; height: 100vh; }
body.log #spin, body.log #msg { display: none; }
body.log #wrap { display: flex; flex-direction: column; flex: 1; min-height: 0;
  padding: 14px 18px 30px; }
body.log #state { display: block; margin: 0 0 8px; font-size: 22px; font-weight: 700; }
body.log #out { display: block; flex: 1; min-height: 0; overflow-y: auto; padding: 10px 12px;
  border: 1px solid var(--line); border-radius: 5px; background: var(--sunk);
  font: 12px/1.45 var(--mono); white-space: pre-wrap; }
.ok { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--warn); }
.byline { position: fixed; bottom: 9px; left: 11px; margin: 0; color: var(--faint);
  font: 11px/1 var(--mono); letter-spacing: 0.06em; }
</style>
</head>
<body>
<div id="brand"><b>ENCORE 14.02</b></div>
<div id="ramBox">initializing...</div>
<div id="spin"></div>
<div id="msg">Restart your console</div>
<div id="wrap">
  <div id="state"></div>
  <div id="out"></div>
</div>
<p class="byline">encore 14.02</p>

<!-- PS4 check BEFORE module load -->
<script>
(function() {
  var ua = navigator.userAgent || '';
  if (!/PlayStation 4/.test(ua)) {
    document.body.className = 'fail';
    var m = document.getElementById('msg');
    if (m) {
      m.style.display = 'block';
      m.innerHTML = '<span style="color:#ff4444;font-size:18px">NOT A PS4</span>'
        + '<br><br><span style="color:#888;font-size:12px">UA: ' + ua + '</span>'
        + '<br><br><span style="color:#aaa;font-size:14px">Open this on your PS4 browser</span>';
    }
    document.getElementById('spin').style.display = 'none';
    window.__ENCORE_BLOCKED = true;
  }
})();
</script>

<!-- Global error handler -->
<script>
window.onerror = function(msg, src, line, col, err) {
  var o = document.getElementById('out');
  if (o) { o.style.display = 'block'; o.textContent += '[CRASH] ' + msg + '\n  at ' + (src||'?') + ':' + line + '\n'; }
  var s = document.getElementById('spin');
  if (s) s.style.display = 'none';
};
</script>

<!-- jb-g.js is the REAL orchestrator — handles core.js, mem.js, offsets, afterglow -->
<script type="module">
if (!window.__ENCORE_BLOCKED) {
  import("./jb-g.js?v=enc1402v4");
}
</script>
</body>
</html>
